
version: "3.9"
services:
  eureka-server:
    build:
      context: .
      dockerfile: ./eureka-server/Dockerfile
    ports: ["8761:8761"]

  # Databases
  auth-db:
    image: postgres:16
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      TZ: Asia/Ho_Chi_Minh
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    ports: ["5433:5432"]
    volumes:
      - auth_data:/var/lib/postgresql/data

  student-db:
    image: postgres:16
    environment:
      POSTGRES_DB: studentdb
      POSTGRES_USER: student
      POSTGRES_PASSWORD: student
      TZ: Asia/Ho_Chi_Minh
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    ports: ["5434:5432"]
    volumes:
      - student_data:/var/lib/postgresql/data

  point-db:
    image: postgres:16
    environment:
      POSTGRES_DB: pointdb
      POSTGRES_USER: point
      POSTGRES_PASSWORD: point
      TZ: Asia/Ho_Chi_Minh
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    ports: ["5435:5432"]
    volumes:
      - point_data:/var/lib/postgresql/data

  # Services
  auth-service:
    build:
      context: .
      dockerfile: ./auth-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/authdb
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: auth
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: "${JWT_SECRET:-S!aQ3xR7vZ0mB2pL9wT8yN4rU6kJ1hF5eD3cG7aH9qW2xE4tY6uI8oP0}"
    depends_on:
      - eureka-server
      - auth-db
    ports: ["8081:8081"]

  student-service:
    build:
      context: .
      dockerfile: ./student-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://student-db:5432/studentdb
      SPRING_DATASOURCE_USERNAME: student
      SPRING_DATASOURCE_PASSWORD: student
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: "${JWT_SECRET:-S!aQ3xR7vZ0mB2pL9wT8yN4rU6kJ1hF5eD3cG7aH9qW2xE4tY6uI8oP0}"
    depends_on:
      - eureka-server
      - student-db
    ports: ["8082:8082"]

  point-service:
    build:
      context: .
      dockerfile: ./point-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://point-db:5432/pointdb
      SPRING_DATASOURCE_USERNAME: point
      SPRING_DATASOURCE_PASSWORD: point
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: "${JWT_SECRET:-S!aQ3xR7vZ0mB2pL9wT8yN4rU6kJ1hF5eD3cG7aH9qW2xE4tY6uI8oP0}"
    depends_on:
      - eureka-server
      - point-db
    ports: ["8083:8083"]

  api-gateway:
    build:
      context: .
      dockerfile: ./api-gateway/Dockerfile
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/
      JWT_SECRET: "${JWT_SECRET:-S!aQ3xR7vZ0mB2pL9wT8yN4rU6kJ1hF5eD3cG7aH9qW2xE4tY6uI8oP0}"
    depends_on:
      - eureka-server
      - auth-service
      - student-service
      - point-service
    ports: ["8090:8090"]

volumes:
  auth_data:
  student_data:
  point_data:


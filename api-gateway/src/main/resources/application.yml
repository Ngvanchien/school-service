server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      routes:
        - id: auth-route
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
#          filters:
#            - StripPrefix=1

        - id: student-route
          uri: lb://student-service
          predicates:
            - Path=/student/**

        - id: point-route
          uri: lb://point-service
          predicates:
            - Path=/point/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods: "*"
            allowedHeaders: "*"

  main:
    web-application-type: reactive

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

jwt:
  secret: "${JWT_SECRET:-S!aQ3xR7vZ0mB2pL9wT8yN4rU6kJ1hF5eD3cG7aH9qW2xE4tY6uI8oP0}"
  issuer: school-ms
